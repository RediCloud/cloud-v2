name: Stable Release

on:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Determine version metadata
  # ──────────────────────────────────────────────
  version:
    name: Determine Version
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      base: ${{ steps.version.outputs.base }}
      git: ${{ steps.version.outputs.git }}
      branch: ${{ steps.version.outputs.branch }}
      full: ${{ steps.version.outputs.full }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine version
        id: version
        run: |
          BASE_VERSION=$(grep '^cloudVersion=' gradle.properties | cut -d'=' -f2)
          GIT_SHA=$(git rev-parse --short=7 HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          FULL_VERSION="${BASE_VERSION}+${GIT_SHA}"

          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL_VERSION}" >> "$GITHUB_OUTPUT"

          echo "### Stable Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${FULL_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${GIT_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Job 2: Build, assemble artifacts, create zip
  # ──────────────────────────────────────────────
  build:
    name: Build & Assemble
    runs-on: ubuntu-latest
    needs: version

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ./.github/actions/setup

      - name: Prepare start scripts
        run: |
          VERSION="${{ needs.version.outputs.base }}"
          sed -i "s/%version%/${VERSION}/g" scripts/start.sh

      - name: Build
        env:
          REDICLOUD_CHANNEL: stable
          REDICLOUD_BUILD: "0"
          REDICLOUD_GIT: ${{ needs.version.outputs.git }}
          REDICLOUD_BRANCH: ${{ needs.version.outputs.branch }}
        run: ./gradlew build -x test -PcloudVersion=${{ needs.version.outputs.base }}

      - name: Assemble release artifacts
        run: |
          mkdir -p export/connectors export/modules export/api-files

          cp services/node-service/build/libs/redicloud-node-service-*.jar export/
          cp connectors/*-connector/build/libs/*.jar export/connectors/
          cp -r api-files/* export/api-files/
          cp scripts/start.sh export/
          cp modules/*/build/libs/*.jar export/modules/ 2>/dev/null || true
          rm -f export/modules/*module-handler*.jar

      - name: Create zip archive
        run: |
          cd export
          zip -r "../redicloud-${{ needs.version.outputs.full }}.zip" .
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          retention-days: 1
          path: |
            export/**
            redicloud-${{ needs.version.outputs.full }}.zip

  # ──────────────────────────────────────────────
  # Job 3: Generate manifest + GPG sign
  # ──────────────────────────────────────────────
  sign:
    name: Manifest & Sign
    runs-on: ubuntu-latest
    needs: [version, build]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Generate release manifest
        run: |
          VERSION="${{ needs.version.outputs.base }}"
          FULL="${{ needs.version.outputs.full }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ZIP_NAME="redicloud-${FULL}.zip"

          cat > manifest.json <<MANIFEST_HEAD
          {
            "version": "${VERSION}",
            "fullVersion": "${FULL}",
            "channel": "stable",
            "timestamp": "${TIMESTAMP}",
            "minJavaVersion": 21,
            "artifacts": {
          MANIFEST_HEAD

          FIRST=true
          for file in "$ZIP_NAME" $(find export -name '*.jar' | sort); do
            HASH=$(sha256sum "$file" | awk '{print $1}')
            SIZE=$(stat --printf="%s" "$file")

            if [[ "$file" == *.zip ]]; then
              KEY="$file"
              TYPE="distribution"
            elif [[ "$file" == *connector* ]]; then
              KEY="${file#export/}"
              TYPE="connector"
            elif [[ "$file" == *node-service* ]]; then
              KEY="${file#export/}"
              TYPE="service"
            else
              KEY="${file#export/}"
              TYPE="module"
            fi

            if $FIRST; then
              FIRST=false
            else
               echo "," >> manifest.json
            fi
            printf '    "%s": {"sha256": "%s", "size": %s, "type": "%s"}' \
              "$KEY" "$HASH" "$SIZE" "$TYPE" >> manifest.json
          done

          cat >> manifest.json <<'MANIFEST_TAIL'

            }
          }
          MANIFEST_TAIL

      - name: GPG sign manifest
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --detach-sign --armor manifest.json

      - name: Upload signed manifest
        uses: actions/upload-artifact@v4
        with:
          name: signed-manifest
          retention-days: 1
          path: |
            manifest.json
            manifest.json.asc

  # ──────────────────────────────────────────────
  # Job 4: Publish Maven artifacts + GitHub Release
  # ──────────────────────────────────────────────
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build, sign]

    permissions:
      contents: write
      packages: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ./.github/actions/setup

      - name: Publish Maven artifacts
        run: ./gradlew publish -PcloudVersion=${{ needs.version.outputs.base }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Download signed manifest
        uses: actions/download-artifact@v4
        with:
          name: signed-manifest

      - name: Generate release body
        id: body
        run: |
          VERSION="${{ needs.version.outputs.base }}"
          FULL="${{ needs.version.outputs.full }}"
          REPO="${{ github.repository }}"
          FINGERPRINT="2ABA6BC97D5FE276C1C7FCA47D569523230B5367"

          git fetch --tags --quiet
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_URL="https://github.com/${REPO}/compare/${PREV_TAG}...v${VERSION}"
          else
            RANGE="HEAD"
            COMPARE_URL=""
          fi

          FEATURES=""
          FIXES=""
          REFACTORS=""
          CI_BUILD=""
          OTHER=""

          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d' ' -f1)
            SHORT_HASH="${HASH:0:7}"
            MSG=$(echo "$line" | cut -d' ' -f2-)

            case "$MSG" in
              feat*)    FEATURES="${FEATURES}\n- ${MSG#feat:} (\`${SHORT_HASH}\`)" ;;
              feat\(*) FEATURES="${FEATURES}\n- ${MSG#feat*: } (\`${SHORT_HASH}\`)" ;;
              fix*)     FIXES="${FIXES}\n- ${MSG#fix:} (\`${SHORT_HASH}\`)" ;;
              fix\(*)  FIXES="${FIXES}\n- ${MSG#fix*: } (\`${SHORT_HASH}\`)" ;;
              refactor*) REFACTORS="${REFACTORS}\n- ${MSG#refactor*: } (\`${SHORT_HASH}\`)" ;;
              ci*|build*) CI_BUILD="${CI_BUILD}\n- ${MSG} (\`${SHORT_HASH}\`)" ;;
              *)        OTHER="${OTHER}\n- ${MSG} (\`${SHORT_HASH}\`)" ;;
            esac
          done < <(git log --oneline --no-merges ${RANGE} 2>/dev/null)

          CHANGELOG=""
          [[ -n "$FEATURES" ]] && CHANGELOG="${CHANGELOG}\n#### Features\n${FEATURES}\n"
          [[ -n "$FIXES" ]] && CHANGELOG="${CHANGELOG}\n#### Bug Fixes\n${FIXES}\n"
          [[ -n "$REFACTORS" ]] && CHANGELOG="${CHANGELOG}\n#### Refactoring\n${REFACTORS}\n"
          [[ -n "$CI_BUILD" ]] && CHANGELOG="${CHANGELOG}\n#### CI / Build\n${CI_BUILD}\n"
          [[ -n "$OTHER" ]] && CHANGELOG="${CHANGELOG}\n#### Other\n${OTHER}\n"

          # Detect new contributors (first-time committers in this range)
          NEW_CONTRIBUTORS=""
          if [[ -n "$PREV_TAG" ]]; then
            declare -A SEEN_AUTHORS
            while IFS= read -r author; do
              [[ -z "$author" ]] && continue
              # Check if this author has commits before the previous tag
              PRIOR_COUNT=$(git log --author="$author" --oneline "${PREV_TAG}" -- 2>/dev/null | wc -l)
              if [[ "$PRIOR_COUNT" -eq 0 ]] && [[ -z "${SEEN_AUTHORS[$author]+x}" ]]; then
                SEEN_AUTHORS["$author"]=1
                # Try to find GitHub username from merge commit
                GH_USER=$(git log --merges --author="$author" --format="%s" ${RANGE} 2>/dev/null | grep -oP '(?<=from )[^/]+' | head -1)
                if [[ -n "$GH_USER" ]]; then
                  NEW_CONTRIBUTORS="${NEW_CONTRIBUTORS}\n- @${GH_USER} made their first contribution"
                else
                  NEW_CONTRIBUTORS="${NEW_CONTRIBUTORS}\n- ${author} made their first contribution"
                fi
              fi
            done < <(git log --format="%aN" --no-merges ${RANGE} 2>/dev/null | sort -u)
          fi

          {
            echo "body<<BODY_EOF"
            echo "### Quick Install"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | bash"
            echo '```'
            echo ""
            echo "### Upgrade"
            echo '```'
            echo "version upgrade stable ${VERSION}"
            echo '```'
            echo ""
            echo "### Verification"
            echo "A signed release manifest (\`manifest.json\` + \`manifest.json.asc\`) is included as release asset."
            echo '```'
            echo "Signing key fingerprint: ${FINGERPRINT}"
            echo '```'
            echo ""
            echo "### Changelog"
            echo -e "$CHANGELOG"
            if [[ -n "$NEW_CONTRIBUTORS" ]]; then
              echo "### New Contributors"
              echo -e "$NEW_CONTRIBUTORS"
              echo ""
            fi
            if [[ -n "$COMPARE_URL" ]]; then
              echo "**Full Changelog**: ${COMPARE_URL}"
            fi
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.base }}
          name: ${{ needs.version.outputs.base }}
          body: ${{ steps.body.outputs.body }}
          prerelease: false
          files: |
            redicloud-${{ needs.version.outputs.full }}.zip
            manifest.json
            manifest.json.asc
            export/connectors/*.jar
          fail_on_unmatched_files: false

  # ──────────────────────────────────────────────
  # Job 5: Cleanup beta releases for this version
  # ──────────────────────────────────────────────
  cleanup:
    name: Cleanup Betas
    needs: publish
    uses: ./.github/workflows/cleanup-releases.yml
    with:
      channel: stable
    secrets: inherit
