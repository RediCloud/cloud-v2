name: Beta Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Beta
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: ./.github/actions/setup

      # --- Determine version ---
      - name: Determine version
        id: version
        run: |
          BASE_VERSION=$(grep '^cloudVersion=' gradle.properties | cut -d'=' -f2)
          BUILD_NUMBER=${{ github.run_number }}
          GIT_SHA=$(git rev-parse --short=7 HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          FULL_VERSION="${BASE_VERSION}-beta.${BUILD_NUMBER}+${GIT_SHA}"
          DISPLAY_VERSION="${BASE_VERSION}-beta.${BUILD_NUMBER}"

          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "git=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "display=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"

          echo "### Beta Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${FULL_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Base:** ${BASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build:** ${BUILD_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${GIT_SHA}" >> "$GITHUB_STEP_SUMMARY"

      # --- Generate version properties ---
      - name: Generate version properties
        run: |
          PROPS_CONTENT="version=${{ steps.version.outputs.base }}
          channel=beta
          build=${{ steps.version.outputs.build }}
          git=${{ steps.version.outputs.git }}
          branch=${{ steps.version.outputs.branch }}
          full-version=${{ steps.version.outputs.full }}"

          RESOURCE_DIRS=(
            "services/node-service/src/main/resources"
          )
          for dir in connectors/*/; do
            name=$(basename "$dir")
            [[ "$name" == "build" || "$name" == "src" ]] && continue
            RESOURCE_DIRS+=("connectors/${name}/src/main/resources")
          done

          for dir in "${RESOURCE_DIRS[@]}"; do
            mkdir -p "$dir"
            echo "$PROPS_CONTENT" > "${dir}/redicloud-version.properties"
          done

      # --- Replace start script placeholders ---
      - name: Prepare start scripts
        run: |
          VERSION="${{ steps.version.outputs.display }}"
          sed -i "s/%version%/${VERSION}/g" scripts/start.sh

      # --- Build ---
      - name: Build
        run: ./gradlew build -x test -PcloudVersion=${{ steps.version.outputs.display }}

      # --- Assemble export ---
      - name: Assemble release artifacts
        run: |
          mkdir -p export/connectors export/modules export/api-files

          cp services/node-service/build/libs/redicloud-node-service-*.jar export/
          cp connectors/*-connector/build/libs/*.jar export/connectors/
          cp -r api-files/* export/api-files/
          cp scripts/start.sh export/
          cp modules/*/build/libs/*.jar export/modules/ 2>/dev/null || true
          rm -f export/modules/*module-handler*.jar

      # --- Create zip ---
      - name: Create zip archive
        run: |
          cd export
          zip -r "../redicloud-${{ steps.version.outputs.full }}.zip" .
          cd ..

      # --- Checksums ---
      - name: Generate SHA256 checksums
        run: |
          sha256sum "redicloud-${{ steps.version.outputs.full }}.zip" > checksums.sha256
          cd export
          sha256sum **/*.jar >> ../checksums.sha256
          cd ..

      # --- GPG signing ---
      - name: GPG sign checksums
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Sign the checksums file (public key is embedded in the binary, not uploaded)
          gpg --batch --yes --pinentry-mode loopback \
            --detach-sign --armor checksums.sha256

      # --- Publish to GitHub Packages ---
      - name: Publish Maven artifacts
        run: ./gradlew publish -PcloudVersion=${{ steps.version.outputs.display }}

      # --- Create GitHub Pre-Release ---
      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.display }}
          name: ${{ steps.version.outputs.display }}
          prerelease: true
          generate_release_notes: true
          files: |
            redicloud-${{ steps.version.outputs.full }}.zip
            checksums.sha256
            checksums.sha256.asc
          fail_on_unmatched_files: false
