build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInInterfaces: 15
  CyclomaticComplexMethod:
    threshold: 20
  NestedBlockDepth:
    threshold: 5
  ComplexCondition:
    threshold: 5

performance:
  SpreadOperator:
    active: false

# detekt-formatting (ktlint) rules are disabled for now.
# The codebase has ~450 pre-existing formatting violations.
# Enable incrementally in a dedicated formatting PR.
formatting:
  active: false

style:
  ReturnCount:
    max: 5
  ForbiddenComment:
    active: false
  MagicNumber:
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '8'
      - '10'
      - '15'
      - '16'
      - '75'
      - '100'
      - '255'
      - '1000'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreRanges: true
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  NewLineAtEndOfFile:
    active: false